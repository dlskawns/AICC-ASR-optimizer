papers:
  - id: sd_qa_2021
    status: verified
    title: "SD-QA: Spoken Dialectal Question Answering for the Real World"
    year: 2021
    venue: "Findings of EMNLP"
    url: "https://arxiv.org/abs/2109.12072"
    doi: null
    relation: "Korean dialect speech -> ASR -> downstream QA; directly threatens/grounds the ASR-to-task framing."
    novelty_threat: "Shows dialectal spoken QA already exists; Busan-AICC must differ by AICC condition, semantic-critical errors, and TA task success."
    verified_notes: "Constructs spoken QA over five languages and 24 dialects, including Korean KOR-C and KOR-SE. Shows ASR quality and QA quality are generally related within language varieties, but task is QA, not AICC TA."
    next_check: "Read tables for exact Korean WER and F1 values before citing numeric results."
  - id: korean_whisper_coda_2026
    status: verified
    title: "Whisper automatic speech recognition errors in Korean complex coda recognition: Syllable coda phonotactics and dialectal variation"
    year: 2026
    venue: "Phonetics and Speech Sciences"
    url: "https://www.eksss.org/archive/view_article?pid=pss-18-1-55"
    doi: "10.13064/KSSS.2026.18.1.055"
    relation: "Korean Whisper dialect/coda error analysis; close prior work for phonological ASR error analysis."
    novelty_threat: "If confirmed, pure Gyeongsang ASR error analysis is insufficiently novel."
    verified_notes: "Uses NIKL Daily Conversation Corpus 2022, 54,536 utterances, Seoul vs Gyeongsang grouped over Busan/Daegu/Gyeongnam/Gyeongbuk/Ulsan, Whisper small/medium/large-v2/large-v3, and complex-coda error analysis."
    next_check: "Extract full tables and statistical tests from PDF before writing paper related work."
  - id: asr_robust_slu_contrastive_2022
    status: verified
    title: "ASR-robust spoken language understanding via contrastive learning"
    year: 2022
    venue: "Interspeech"
    url: "https://www.isca-archive.org/interspeech_2022/chang22c_interspeech.html"
    doi: "10.21437/Interspeech.2022-781"
    relation: "Clean transcript and ASR transcript representations are aligned for robust SLU."
    novelty_threat: "TA robustness cannot be claimed as novel unless tied to Korean dialect/AICC semantic-critical errors."
    verified_notes: "Focuses on utterance representations robust to ASR errors using contrastive objective plus supervised contrastive learning and self-distillation."
    next_check: "Read full paper for datasets and whether slot filling is evaluated."
  - id: c2a_slu_2023
    status: verified
